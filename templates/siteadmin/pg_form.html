{% extends 'base.html' %}
{% block title %}New PG • PG-MS{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Create PG</h1>
<form method="post" class="card border-0 shadow-sm">
  {% csrf_token %}
  <div class="card-body p-4">
    <div class="mb-3">
      <label class="form-label">Name</label>
      {{ form.name }}
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      {{ form.address }}
    </div>
    <button class="btn btn-primary" type="submit">Create</button>
    <a href="{% url 'sa_pgs' %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
