{% extends 'base.html' %}
{% block title %}Fees • PG-MS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div class="d-flex align-items-center gap-2">
    <h1 class="h5 mb-0">Fees</h1>
    {% if pgs and pgs|length > 1 %}
    <form method="get">
      <select name="pg" class="form-select form-select-sm" onchange="this.form.submit()">
        {% for p in pgs %}
        <option value="{{ p.id }}" {% if pg and p.id == pg.id %}selected{% endif %}>{{ p.name }}</option>
        {% endfor %}
      </select>
    </form>
    {% elif pg %}
      <span class="badge bg-light text-dark">{{ pg.name }}</span>
    {% endif %}
  </div>
  <a class="btn btn-outline-secondary" href="{% url 'fees_list' %}">Back</a>
 </div>
<form method="post" class="card border-0 shadow-sm">
  {% csrf_token %}
  <div class="card-body p-4">
    <div class="mb-3">
  <label class="form-label">Bed Type</label>
      {{ form.share_type }}
    </div>
    <div class="mb-3">
      <label class="form-label">Monthly Fee</label>
      {{ form.monthly_fee }}
    </div>
    <div class="mb-3">
      <label class="form-label">Advance Amount</label>
      {{ form.advance_amount }}
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
{% endblock %}
