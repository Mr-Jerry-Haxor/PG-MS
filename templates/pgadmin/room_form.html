{% extends 'base.html' %}
{% block title %}Room • PG-MS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div class="d-flex align-items-center gap-2">
    <h1 class="h4 mb-0">New Room</h1>
    {% if pgs and pgs|length > 1 %}
    <form method="get">
      <select name="pg" class="form-select form-select-sm" onchange="this.form.submit()">
        {% for p in pgs %}
        <option value="{{ p.id }}" {% if pg and p.id == pg.id %}selected{% endif %}>{{ p.name }}</option>
        {% endfor %}
      </select>
    </form>
    {% elif pg %}
      <span class="badge bg-light text-dark">{{ pg.name }}</span>
    {% endif %}
  </div>
  <a class="btn btn-outline-secondary" href="{% url 'pg_rooms' %}">Back</a>
 </div>
<form method="post" class="card border-0 shadow-sm">
  {% csrf_token %}
  <div class="card-body p-4">
    <div class="mb-3">
      <label class="form-label">Room No</label>
      {{ form.room_no }}
    </div>
    <div class="mb-3">
      <label class="form-label">Total Shares</label>
      {{ form.total_shares }}
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-outline-secondary" href="{% url 'pg_rooms' %}">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
