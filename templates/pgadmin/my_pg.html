{% extends 'base.html' %}
{% block title %}My PG • PG-MS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div class="d-flex align-items-center gap-2">
    <h1 class="h4 mb-0">My PG</h1>
    {% if pgs and pgs|length > 1 %}
    <form method="get">
      <select name="pg" class="form-select form-select-sm" onchange="this.form.submit()">
        {% for p in pgs %}
        <option value="{{ p.id }}" {% if pg and p.id == pg.id %}selected{% endif %}>{{ p.name }}</option>
        {% endfor %}
      </select>
    </form>
    {% endif %}
  </div>
  <div>
    <a href="{% url 'pg_rooms' %}" class="btn btn-outline-primary">Manage Rooms</a>
  </div>
</div>
<form method="post" class="card border-0 shadow-sm">
  {% csrf_token %}
  <div class="card-body p-4">
    <div class="mb-3">
      <label class="form-label">Name</label>
      {{ form.name }}
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      {{ form.address }}
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
{% endblock %}
